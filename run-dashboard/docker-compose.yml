services:
  backend:
    build: ./backend
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    env_file:
      - .env
    environment:
      - USE_REAL_GARMIN=True
      - DB_PATH=/app/data/master_users.db
  frontend:
    build: ./frontend
    ports:
      - "3002:3000"
    volumes:
      - ./frontend/src:/app/src
    stdin_open: true
    tty: true
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - WDS_SOCKET_HOST=${WDS_SOCKET_HOST}
      - WDS_SOCKET_PORT=${WDS_SOCKET_PORT}

